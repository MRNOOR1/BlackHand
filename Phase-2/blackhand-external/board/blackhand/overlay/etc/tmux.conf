# Terminfo entry that notcurses/tmux agree on (installed via BR2_PACKAGE_NCURSES_ADDITIONAL_TERMINFO).
set -g default-terminal "tmux-256color"
# No status bar stealing a row on a 16-row display.
set -g status off
# Esc reaches the UI immediately.
set -g escape-time 0
# Attached clients see the panel's real geometry (smallest attached client wins).
set -g window-size smallest
