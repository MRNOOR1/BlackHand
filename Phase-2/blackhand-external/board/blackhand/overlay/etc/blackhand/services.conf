# =============================================================================
# BlackHand OS — service configuration
# =============================================================================
#
# This file is read by the service manager (/usr/bin/blackhand-svc-mgr) on
# startup. Services are started in the order they appear here — do not
# change the order without understanding the dependencies.
#
# FORMAT
# ------
# [service-name]       — starts a new service block
# exec    = /path      — full path to the service binary
# restart = always     — restart the service if it crashes
#
# Lines starting with # are comments. Blank lines are ignored.
#
# START ORDER AND DEPENDENCIES
# ----------------------------
# audio and modem must start before ui because each creates a Unix socket
# that the UI connects to. If ui starts first it will fail to connect.
#
#   blackhand-audio    → creates /run/bh-audio.sock
#   blackhand-modem    → creates /run/bh-modem.sock
#   blackhand-ui       → connects to both sockets as a client
#
# =============================================================================

# ── Audio service ─────────────────────────────────────────────────────────────
# Owns all sound hardware via ALSA. Exposes JSON-RPC methods: play, pause,
# stop, volume. Listens on /run/bh-audio.sock.
[blackhand-audio]
exec    = /usr/bin/blackhand-audio
restart = always

# ── Storage service ───────────────────────────────────────────────────────────
# Owns ALL persistent communication data: /data/contacts/contacts.json and
# /data/numbers/<E.164>/{sms,calls}.json. The modem service WRITES history
# here on every URC event; the UI READS. Must start before both.
# Listens on /run/bh-storage.sock.
[blackhand-storage]
exec    = /usr/bin/blackhand-storage
restart = always

# ── Modem service ─────────────────────────────────────────────────────────────
# Owns the radio modem via AT commands. Exposes JSON-RPC methods for calls
# and SMS. Listens on /run/bh-modem.sock.
[blackhand-modem]
exec    = /usr/bin/blackhand-modem
restart = always

# ── UI service ────────────────────────────────────────────────────────────────
# Owns the display. Renders all screens via Notcurses on tty1. Connects to
# audio, storage, and modem sockets as a client. Started last.
[blackhand-ui]
exec    = /usr/bin/blackhand-ui
restart = always
