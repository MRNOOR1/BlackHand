[General]
# Name other devices see when they scan for us
Name = BlackHand

# 0x200204 = Major: Phone, Minor: Cellular
# Tells scanning devices we're a phone (affects icon/category shown)
Class = 0x200204

# Auto-stop being discoverable after 120 s. The device must NOT be permanently
# discoverable — discoverability is enabled transiently, only when the user
# opens the pairing screen, and this timeout guarantees it turns itself back
# off even if that flow is interrupted.
DiscoverableTimeout = 120

# Auto-stop accepting new pairings after 120 s for the same reason.
PairableTimeout = 120

# Respond faster to reconnection attempts from bonded devices
FastConnectable = true

[Policy]
# Power on the BT adapter automatically when bluetoothd starts.
# Without this, hci0 registers but stays off — "Powered: no" in
# bluetoothctl show, scanning and connecting never work.
AutoEnable=true

# Do NOT silently re-pair bonded devices with Just Works. "always" let any
# device claiming a bonded address silently replace its keys with no user
# action, which enables impersonation/MITM. "never" (BlueZ default) forces a
# fresh, user-initiated pairing if a bond ever needs to be re-established.
JustWorksRepairing = never
