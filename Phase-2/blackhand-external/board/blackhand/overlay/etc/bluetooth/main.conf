[General]
# Name other devices see when they scan for us
Name = BlackHand

# 0x200204 = Major: Phone, Minor: Cellular
# Tells scanning devices we're a phone (affects icon/category shown)
Class = 0x200204

# Stay discoverable indefinitely (default times out after 180 seconds)
DiscoverableTimeout = 0

# Respond faster to reconnection attempts from bonded devices
FastConnectable = true

[Policy]
# Power on the BT adapter automatically when bluetoothd starts.
# Without this, hci0 registers but stays off — "Powered: no" in
# bluetoothctl show, scanning and connecting never work.
AutoEnable=true

# Re-pair with Just Works even if already bonded.
# Prevents "Authentication Failed" when a bonded device tries to
# reconnect after its pairing state drifted out of sync with ours.
JustWorksRepairing = always
