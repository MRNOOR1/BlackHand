# ============================================================================
# Black Hand OS - SD Card Image Layout
# ============================================================================
#
# GPU firmware: config.txt uses gpu_mem=64, which lets the VideoCore boot
# with the standard start4.elf/fixup4.dat — the only variants Buildroot's
# rpi-firmware package installs. If you ever lower gpu_mem below 32, the
# firmware demands the cutdown blobs (start4cd.elf/fixup4cd.dat) and will
# silently halt before Linux loads. See the comment on gpu_mem in
# rpi-firmware/config.txt for the full story.
#
image boot.vfat {
    vfat {
        files = {
            "Image",
            "bcm2711-rpi-4-b.dtb",
            "config.txt",
            "cmdline.txt",
            "overlays/",
            "start4.elf",
            "fixup4.dat"
        }
    }
    size = 128M
}

image sdcard.img {
    hdimage {
        partition-table-type = "dos"
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
